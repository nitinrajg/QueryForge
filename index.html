<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306B6D4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><ellipse cx='12' cy='5' rx='9' ry='3'/><path d='M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5'/><path d='M3 12c0 1.66 4 3 9 3s9-1.34 9-3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#07090E" />
    <title>QueryForge — Zero-Server SQL Practice & Analytics Studio</title>
    <meta name="description" content="Production-grade, client-side SQL and data engineering practice studio. In-browser WebAssembly engines, 111+ LeetCode & interview problems, and interactive theory guides." />
    
    <!-- High-Craft Typography: Space Grotesk (Display) + Plus Jakarta Sans (UI) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('queryforge-theme');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed.state && parsed.state.theme === 'light') {
              document.documentElement.classList.remove('dark');
              return;
            }
          }
        } catch (e) {}
        document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#07090E] text-[#0F172A] dark:text-[#E2E8F0] font-sans antialiased selection:bg-cyan-500/20 selection:text-cyan-300 transition-colors duration-150 overflow-x-hidden min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
