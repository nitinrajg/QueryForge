<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff4a1f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><ellipse cx='12' cy='5' rx='9' ry='3'/><path d='M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5'/><path d='M3 12c0 1.66 4 3 9 3s9-1.34 9-3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#18191b" />
    <title>QueryForge — In-Browser SQL Practice & Terminal</title>
    <meta name="description" content="Client-side SQL practice platform with in-browser engines, 111 interview problems, and interactive theory lessons." />
    
    <!-- Typography: Gambarino 400 (Display) + General Sans 400/500 (UI/Text) via Fontshare, JetBrains Mono (Code editor only) -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=gambarino@400&f[]=general-sans@400,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('queryforge-theme');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed.state && parsed.state.theme === 'light') {
              document.documentElement.classList.remove('dark');
              return;
            }
          }
        } catch (e) {}
        document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="bg-[#eff0f1] dark:bg-[#18191b] text-[#18191b] dark:text-[#eff0f1] font-sans antialiased selection:bg-[#ff4a1f] selection:text-[#18191b] transition-colors duration-150 overflow-x-hidden min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
